name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Syntax check
        run: for f in *.lua; do luajit -bl "$f" > /dev/null || exit 1; done
      - name: Snippet tests
        run: luajit tests/snippets_test.lua
